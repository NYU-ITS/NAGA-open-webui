name: Custom Model E2E Tests

on:
  push:
    branches:
      - rs/ai-tutor-tests
    paths:
      - "playwright/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/custom-model-e2e-tests.yaml"
  pull_request:
    branches:
      - rs/ai-tutor-tests
    paths:
      - "playwright/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/custom-model-e2e-tests.yaml"
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live E2E tests against deployed OpenShift app"
        required: false
        default: "false"

permissions:
  contents: read
  checks: write

jobs:
  e2e-ci-app:
    name: "E2E – CI (Mocked)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mocked Playwright tests
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
        run: npx playwright test playwright/tests/models/*.mocked.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ci-app-playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ci-app-test-results
          path: test-results/

  # Manual GitHub Actions smoke against deployed app.
  e2e-live:
    name: "E2E – Live (OpenShift)"
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_live == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run live Playwright tests
        env:
          PLAYWRIGHT_RUN_LIVE: "1"
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_STUDENT_EMAIL: ${{ secrets.PLAYWRIGHT_STUDENT_EMAIL }}
          PLAYWRIGHT_STUDENT_PASSWORD: ${{ secrets.PLAYWRIGHT_STUDENT_PASSWORD }}
        run: npx playwright test playwright/tests/models/*.live.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-test-results
          path: test-results/
