name: Custom Model Backend Tests

on:
  push:
    branches:
      - rs/ai-tutor-tests
      - tests/custom-models
    paths:
      - "backend/**"
      - "tests/unit/backend/**"
      - "tests/integration/backend/**"
      - "tests/requirements-testing.txt"
      - "tests/constraints-ci.txt"
      - ".github/workflows/custom-model-backend-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-backend:
    name: 'Backend Unit & Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: tests/constraints-ci.txt
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel uv
          uv pip install --system -r backend/requirements.txt -r tests/requirements-testing.txt -c tests/constraints-ci.txt

      - name: Run backend tests
        env:
          WEBUI_SECRET_KEY: test-secret-key
          PYTHONPATH: backend
        run: |
          mkdir -p test-results
          pytest tests/unit/backend/ -v --junitxml=test-results/unit-results.xml --tb=short
          pytest tests/integration/backend/ -v --junitxml=test-results/integration-results.xml --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/*.xml
          check_name: "Backend Test Results"
          comment_mode: "off"
