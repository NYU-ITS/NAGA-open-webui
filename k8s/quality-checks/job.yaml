apiVersion: batch/v1
kind: Job
metadata:
  name: ai-tutor-frontend-post-deploy-quality-check
  labels:
    app.kubernetes.io/name: ai-tutor-frontend-post-deploy-quality-check
    app.kubernetes.io/component: frontend-quality-check
    app.kubernetes.io/part-of: ai-tutor-quality
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: frontend-post-deploy-quality-checks
          image: image-registry.openshift-image-registry.svc:5000/rit-genai-naga-dev/ai-tutor-frontend-quality-checks:latest
          imagePullPolicy: Always
          env:
            - name: QUALITY_ENVIRONMENT
              value: openshift-dev
            - name: QUALITY_REPOSITORY
              value: NAGA-open-webui
            - name: QUALITY_BRANCH
              value: rs/ai-tutor-tests
            - name: QUALITY_SOURCE
              value: openshift-frontend-live-playwright
            - name: QUALITY_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: QUALITY_COMMIT_SHA
              value: openshift-build
            - name: QUALITY_FORWARD_SECONDS
              value: "75"
            - name: PLAYWRIGHT_VIDEO
              value: "off"
            - name: PLAYWRIGHT_RUN_LIVE
              value: "1"
            - name: PLAYWRIGHT_SKIP_WEB_SERVER
              value: "1"
            - name: PLAYWRIGHT_BASE_URL
              value: http://open-webui.rit-genai-naga-dev.svc:80
            - name: PLAYWRIGHT_WORKERS
              value: "1"
            - name: PLAYWRIGHT_RETRIES
              value: "0"
            - name: PLAYWRIGHT_HOMEWORK_PDF_PATH
              value: /workspace/playwright/fixtures/Math_HW.pdf
            - name: PLAYWRIGHT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ai-tutor-playwright-live-secret
                  key: admin-email
            - name: PLAYWRIGHT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-tutor-playwright-live-secret
                  key: admin-password
            - name: PLAYWRIGHT_STUDENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ai-tutor-playwright-live-secret
                  key: student-email
            - name: PLAYWRIGHT_STUDENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-tutor-playwright-live-secret
                  key: student-password
            - name: QUALITY_PUSHGATEWAY_URL
              value: http://ai-tutor-quality-pushgateway:9091
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
