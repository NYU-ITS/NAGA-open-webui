apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: open-webui
spec:
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: registry.cloud.rt.nyu.edu/rit-genai-poc/naga-open-webui:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Source
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ai-tutor-frontend-quality-checks
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ai-tutor-frontend-quality-checks
spec:
  failedBuildsHistoryLimit: 2
  successfulBuildsHistoryLimit: 2
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/NYU-ITS/NAGA-open-webui.git
      ref: rs/ai-tutor-tests
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: quality_checks/Dockerfile
      volumes:
        - name: ai-tutor-playwright-live-secret
          source:
            type: Secret
            secret:
              secretName: ai-tutor-playwright-live-secret
          mounts:
            - destinationPath: /var/run/ai-tutor-playwright-live-secret
      env:
        # Build pods cannot mount PVCs, so build-triggered Playwright checks
        # publish metrics only; artifacts are written by the post-deploy Job,
        # which mounts the ai-tutor-quality-artifacts PVC.
        - name: QUALITY_UPLOAD_ARTIFACTS
          value: "0"
  output:
    to:
      kind: ImageStreamTag
      name: ai-tutor-frontend-quality-checks:latest
  postCommit:
    script: bash scripts/run_openshift_frontend_quality_checks_from_build.sh
  triggers:
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: open-webui:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
