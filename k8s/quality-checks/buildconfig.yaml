apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: open-webui
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ai-tutor-frontend-quality-checks
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ai-tutor-frontend-quality-checks
spec:
  failedBuildsHistoryLimit: 2
  successfulBuildsHistoryLimit: 2
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/NYU-ITS/NAGA-open-webui.git
      ref: rs/ai-tutor-tests
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: quality_checks/Dockerfile
      volumes:
        - name: ai-tutor-playwright-live-secret
          source:
            type: Secret
            secret:
              secretName: ai-tutor-playwright-live-secret
          mounts:
            - destinationPath: /var/run/ai-tutor-playwright-live-secret
        - name: ai-tutor-playwright-fixtures
          source:
            type: ConfigMap
            configMap:
              name: ai-tutor-playwright-fixtures
          mounts:
            - destinationPath: /workspace/playwright-fixtures
  output:
    to:
      kind: ImageStreamTag
      name: ai-tutor-frontend-quality-checks:latest
  postCommit:
    script: bash scripts/run_openshift_frontend_quality_checks_from_build.sh
  triggers:
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: open-webui:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
